# Put this at .github/workflows/supabase-keepalive.yml in the strathun.github.io repo
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 15 * * *'   # daily at 15:17 UTC (~9:17am Mountain)
  workflow_dispatch:         # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query a table so it counts as database activity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TABLE: travel_trips   # any existing table works; RLS returning 0 rows is fine
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/$TABLE?select=*&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "Supabase responded with HTTP $status"
          # Fail the job on anything but 200 so GitHub emails you
          [ "$status" = "200" ] || exit 1
